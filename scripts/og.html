<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 1200px;
        height: 630px;
        background: #000;
        color: #fff;
        font-family: Inter, sans-serif;
        overflow: hidden;
        position: relative;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 48px 48px;
      }
      .glow {
        position: absolute;
        width: 520px;
        height: 520px;
        right: -80px;
        top: -120px;
        background: radial-gradient(circle, rgba(59,130,246,0.28), transparent 70%);
      }
      .content {
        position: relative;
        z-index: 1;
        height: 100%;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand {
        font-size: 28px;
        letter-spacing: 0.28em;
        font-weight: 700;
      }
      .role {
        margin-top: 18px;
        font-size: 20px;
        color: rgba(147,197,253,0.95);
        letter-spacing: 0.08em;
      }
      h1 {
        margin-top: 48px;
        font-size: 64px;
        line-height: 0.95;
        letter-spacing: 0.02em;
        font-weight: 700;
        max-width: 900px;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: end;
        color: rgba(255,255,255,0.55);
        font-size: 18px;
        letter-spacing: 0.04em;
      }
      .pill {
        border: 1px solid rgba(255,255,255,0.2);
        padding: 10px 16px;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="content">
      <div>
        <div class="brand">XYANUA</div>
        <div class="role">CYBERSECURITY & AI ENGINEER</div>
        <h1>I bring the adversarial<br/>to security & AI systems</h1>
      </div>
      <div class="footer">
        <div>imxyanua.github.io</div>
        <div class="pill">Red team · AI agents · Detection</div>
      </div>
    </div>
  </body>
</html>
