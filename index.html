    <script>
      // Apply saved / navigator language before React mounts to avoid EN flash
      ;(function () {
        try {
          var saved = localStorage.getItem('xyanua-lang')
          var lang =
            saved === 'vi' || saved === 'en' || saved === 'zh'
              ? saved
              : (navigator.language || 'en').toLowerCase().indexOf('vi') === 0
                ? 'vi'
                : (navigator.language || 'en').toLowerCase().indexOf('zh') === 0
                  ? 'zh'
                  : 'en'
          document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang
          document.documentElement.dataset.lang = lang
        } catch (e) {}
      })()
    </script>
